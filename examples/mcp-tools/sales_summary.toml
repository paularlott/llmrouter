description = "Summarize sales figures per region"
keywords = ["sales", "report"]

[[parameters]]
name = "region"
type = "string"
description = "Region to summarize (eu, us, apac); 'all' summarizes everything"
required = false

# MCP Apps link (SEP-1865): hosts that implement the UI extension render the
# ui://sales.html view when this tool is invoked instead of showing raw text.
[ui]
resourceUri = "ui://sales.html"

# The icons convention: src may be an https:// URL or a base64 data: URI
# (below). Generate the block for your own icon file with the scriptling
# toolchain helper: scriptling tools/make_icon/make_icon.py icon.svg
[[icons]]
src = "data:image/svg+xml;base64,"
mimeType = "image/svg+xml"
sizes = ["any"]
