version: "3"

vars:
  BINARY_NAME: llmrouter
  VERSION:
    sh: go run ./tools/getversion
  REGISTRY: '{{.REGISTRY | default "paularlott"}}'
  HUB: '{{.HUB | default "registry-1.docker.io/"}}'
  BUILD_WITH:
    sh: |
      if [ -n "${BUILD_WITH}" ]; then
        echo "${BUILD_WITH}"
      elif command -v docker >/dev/null 2>&1; then
        echo "docker"
      elif command -v podman >/dev/null 2>&1; then
        echo "podman"
      else
        echo "none"
      fi
  PLATFORM_ARG: "--platform linux/amd64,linux/arm64"
  LDFLAGS: -ldflags="-s -w -X github.com/paularlott/llmrouter/build.BuildDate=$(date -u +%Y-%m-%dT%H:%M:%SZ)"

tasks:
  assets:
    desc: Build frontend assets
    dir: web
    cmds:
      - npm run build

  default:
    desc: Build for the current platform
    deps: [assets]
    cmds:
      - go build {{.LDFLAGS}} -o {{.BINARY_NAME}} .

  clean:
    desc: Clean build artifacts
    cmds:
      - rm -rf dist/
      - rm -f {{.BINARY_NAME}}
      - rm -rf web/dist/

  test:
    desc: Run tests
    cmds:
      - go test -v ./...

  lint:
    desc: Run linter
    cmds:
      - golangci-lint run

  # Individual platform builds
  build-linux-amd64:
    desc: Build for Linux AMD64
    deps: [assets]
    cmds:
      - GOOS=linux GOARCH=amd64 go build {{.LDFLAGS}} -o dist/{{.BINARY_NAME}}-linux-amd64 .

  build-linux-arm64:
    desc: Build for Linux ARM64
    deps: [assets]
    cmds:
      - GOOS=linux GOARCH=arm64 go build {{.LDFLAGS}} -o dist/{{.BINARY_NAME}}-linux-arm64 .

  build-darwin-amd64:
    desc: Build for macOS AMD64
    deps: [assets]
    cmds:
      - GOOS=darwin GOARCH=amd64 go build {{.LDFLAGS}} -o dist/{{.BINARY_NAME}}-darwin-amd64 .

  build-darwin-arm64:
    desc: Build for macOS ARM64
    deps: [assets]
    cmds:
      - GOOS=darwin GOARCH=arm64 go build {{.LDFLAGS}} -o dist/{{.BINARY_NAME}}-darwin-arm64 .

  build-windows-amd64:
    desc: Build for Windows AMD64
    deps: [assets]
    cmds:
      - GOOS=windows GOARCH=amd64 go build {{.LDFLAGS}} -o dist/{{.BINARY_NAME}}-windows-amd64.exe .

  build-windows-arm64:
    desc: Build for Windows ARM64
    deps: [assets]
    cmds:
      - GOOS=windows GOARCH=arm64 go build {{.LDFLAGS}} -o dist/{{.BINARY_NAME}}-windows-arm64.exe .

  # Build all platforms in parallel
  build-all:
    desc: Build for all platforms
    deps: [clean]
    cmds:
      - mkdir -p dist
      - task: build-platforms
      - task: create-zips

  build-platforms:
    desc: Build for all platforms (Linux, macOS, Windows)
    deps:
      - build-linux-amd64
      - build-linux-arm64
      - build-darwin-amd64
      - build-darwin-arm64
      - build-windows-amd64
      - build-windows-arm64

  create-zips:
    desc: Create ZIP files for all platforms
    cmds:
      - cd dist && cp llmrouter-darwin-amd64 llmrouter && zip llmrouter-darwin-amd64.zip llmrouter && rm llmrouter
      - cd dist && cp llmrouter-darwin-arm64 llmrouter && zip llmrouter-darwin-arm64.zip llmrouter && rm llmrouter
      - cd dist && cp llmrouter-linux-amd64 llmrouter && zip llmrouter-linux-amd64.zip llmrouter && rm llmrouter
      - cd dist && cp llmrouter-linux-arm64 llmrouter && zip llmrouter-linux-arm64.zip llmrouter && rm llmrouter
      - cd dist && cp llmrouter-windows-amd64.exe llmrouter.exe && zip llmrouter-windows-amd64.zip llmrouter.exe && rm llmrouter.exe
      - cd dist && cp llmrouter-windows-arm64.exe llmrouter.exe && zip llmrouter-windows-arm64.zip llmrouter.exe && rm llmrouter.exe

  release:
    desc: Tag the version and create GitHub release with all platform binaries
    deps: [build-all]
    cmds:
      - |
        # Check if tag exists
        if git tag -l v{{.VERSION}} | grep -q v{{.VERSION}}; then
          echo "Tag v{{.VERSION}} already exists, skipping tag creation"
        else
          echo "Creating tag v{{.VERSION}}"
          git tag -a v{{.VERSION}} -m "Release {{.VERSION}}"
          git push origin v{{.VERSION}}
        fi
        # Create release and upload zip files only
        gh release create v{{.VERSION}} -t "Release {{.VERSION}}" -n "LLM Router {{.VERSION}}" dist/*.zip
      - task: homebrew-formula

  homebrew-formula:
    desc: Generate the Homebrew formula
    cmds:
      - go run ./scripts/homebrew-formula/ > ../homebrew-tap/Formula/llmrouter.rb

  run-server:
    desc: Run the server in development mode
    deps: [assets]
    cmds:
      - >-
        go run . server
        --personas-dir ./examples/personas
        --commands-dir ./examples/commands

  watch:
    desc: Watch for changes and rebuild
    cmds:
      - |
        while true; do
          fswatch -1 -e ".*" -i "\\.go$" .
          go build {{.LDFLAGS}} -o {{.BINARY_NAME}} .
          echo "Rebuilt at $(date)"
        done

  container:
    desc: Build the docker image and push to Docker Hub
    method: none
    cmds:
      - |
        echo "Detected container runtime: {{.BUILD_WITH}}"
        echo "Building for platforms: {{.PLATFORM_ARG}}"

        if [ "{{.BUILD_WITH}}" = "podman" ]; then
          podman manifest create {{.REGISTRY}}/llmrouter:{{.VERSION}}
          podman build \
            {{.PLATFORM_ARG}} \
            --manifest {{.REGISTRY}}/llmrouter:{{.VERSION}} \
            --build-arg VERSION={{.VERSION}} \
            --build-arg DOCKER_HUB={{.HUB}} \
            .
          podman tag {{.REGISTRY}}/llmrouter:{{.VERSION}} {{.REGISTRY}}/llmrouter:latest
          podman manifest push {{.REGISTRY}}/llmrouter:{{.VERSION}}
          podman manifest push {{.REGISTRY}}/llmrouter:latest
        else
          docker buildx build \
          {{.PLATFORM_ARG}} \
          --tag {{.REGISTRY}}/llmrouter:{{.VERSION}} \
          --tag {{.REGISTRY}}/llmrouter:latest \
          --build-arg VERSION={{.VERSION}} \
          --build-arg DOCKER_HUB={{.HUB}} \
          --push \
          .
        fi

  container-local:
    desc: Build the docker image locally (no push)
    method: none
    cmds:
      - |
        echo "Detected container runtime: {{.BUILD_WITH}}"
        echo "Building for local platform only"

        if [ "{{.BUILD_WITH}}" = "podman" ]; then
          podman build \
            --tag {{.REGISTRY}}/llmrouter:{{.VERSION}} \
            --tag {{.REGISTRY}}/llmrouter:latest \
            --build-arg VERSION={{.VERSION}} \
            --build-arg DOCKER_HUB={{.HUB}} \
            .
        else
          docker build \
            --tag {{.REGISTRY}}/llmrouter:{{.VERSION}} \
            --tag {{.REGISTRY}}/llmrouter:latest \
            --build-arg VERSION={{.VERSION}} \
            --build-arg DOCKER_HUB={{.HUB}} \
            .
        fi

  tag:
    desc: Tag the current code with the version and push to GitHub
    cmds:
      - git tag -a v{{.VERSION}} -m "Release {{.VERSION}}"
      - git push origin v{{.VERSION}}
    status:
      - git tag -l v{{.VERSION}}
