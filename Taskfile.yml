version: "3"

vars:
  BINARY_NAME: llmrouter
  VERSION:
    sh: go run ./tools/getversion
  LDFLAGS: -ldflags="-s -w -X github.com/paularlott/llmrouter/build.BuildDate=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
  WINDOWS_LDFLAGS: -ldflags="-s -w -H windowsgui -X github.com/paularlott/llmrouter/build.BuildDate=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
  REGISTRY: '{{.REGISTRY | default "paularlott"}}'
  HUB: '{{.HUB | default "registry-1.docker.io/"}}'
  BUILD_WITH:
    sh: |
      if [ -n "${BUILD_WITH}" ]; then echo "${BUILD_WITH}"
      elif command -v docker >/dev/null 2>&1; then echo "docker"
      elif command -v podman >/dev/null 2>&1; then echo "podman"
      else echo "none"; fi
  PLATFORM_ARG: "--platform linux/amd64,linux/arm64"

tasks:
  assets:
    desc: Build frontend assets
    dir: web
    cmds:
      - npm run build

  generate:icon:
    desc: Regenerate macOS .icns from icon.svg
    preconditions:
      - sh: command -v rsvg-convert >/dev/null 2>&1
        msg: "rsvg-convert not found. Install with: brew install librsvg"
    cmds:
      - |
        mkdir -p /tmp/icon.iconset
        for spec in "16:16" "16:32" "32:32" "32:64" "128:128" "128:256" "256:256" "256:512" "512:512" "512:1024"; do
          size="${spec%%:*}"; out="${spec##*:}"
          rsvg-convert -w $size -h $size icon.svg -o /tmp/icon.iconset/icon_${out/x/x}.png 2>/dev/null || \
          rsvg-convert -w $size -h $size icon.svg -o /tmp/icon.iconset/icon_${out%@*}@${out#@*}.png
        done
        iconutil -c icns /tmp/icon.iconset -o build/darwin/icon.icns
        rm -rf /tmp/icon.iconset
        echo "✓ build/darwin/icon.icns"

  default:
    desc: Build for the current platform
    deps: [assets]
    cmds:
      - go build {{.LDFLAGS}} -o {{.BINARY_NAME}} .

  clean:
    desc: Clean build artifacts
    cmds:
      - rm -rf dist/
      - rm -f {{.BINARY_NAME}}
      - rm -rf web/dist/

  test:
    desc: Run tests
    cmds:
      - go test -v ./...

  lint:
    desc: Run linter
    cmds:
      - golangci-lint run

  # ──────────────────────────────────────────────────────────────────────────
  # Platform builds — single binary, CGO_ENABLED=0, cross-compile from any host.
  # macOS builds include .app bundle packaging.
  #
  # Linux has two variants:
  #   - build-linux-*        server only (-tags server): fully static binary,
  #                          no webview/GUI dependencies, runs anywhere
  #                          (including Alpine/musl containers).
  #   - build-linux-desktop-* includes the webview desktop mode. Links against
  #                          glibc (via purego/dlopen); needs WebKitGTK
  #                          installed for desktop mode.
  # ──────────────────────────────────────────────────────────────────────────
  build-linux-amd64:
    desc: Build for Linux AMD64 (server only, static binary)
    deps: [assets]
    cmds:
      - CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -tags=server {{.LDFLAGS}} -o dist/{{.BINARY_NAME}}-linux-amd64 .

  build-linux-arm64:
    desc: Build for Linux ARM64 (server only, static binary)
    deps: [assets]
    cmds:
      - CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -tags=server {{.LDFLAGS}} -o dist/{{.BINARY_NAME}}-linux-arm64 .

  build-linux-desktop-amd64:
    desc: Build for Linux AMD64 with desktop webview mode
    deps: [assets]
    cmds:
      - CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build {{.LDFLAGS}} -o dist/{{.BINARY_NAME}}-linux-desktop-amd64 .

  build-linux-desktop-arm64:
    desc: Build for Linux ARM64 with desktop webview mode
    deps: [assets]
    cmds:
      - CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build {{.LDFLAGS}} -o dist/{{.BINARY_NAME}}-linux-desktop-arm64 .

  build-darwin-arm64:
    desc: Build for macOS ARM64 (+ .app bundle)
    deps: [assets]
    cmds:
      - CGO_ENABLED=0 GOOS=darwin GOARCH=arm64 go build {{.LDFLAGS}} -o dist/{{.BINARY_NAME}}-darwin-arm64 .
      - task: package-darwin-arch
        vars: { DARWIN_ARCH: arm64 }

  build-darwin-amd64:
    desc: Build for macOS AMD64 (+ .app bundle)
    deps: [assets]
    cmds:
      - CGO_ENABLED=0 GOOS=darwin GOARCH=amd64 go build {{.LDFLAGS}} -o dist/{{.BINARY_NAME}}-darwin-amd64 .
      - task: package-darwin-arch
        vars: { DARWIN_ARCH: amd64 }

  build-windows-amd64:
    desc: Build for Windows AMD64
    deps: [assets]
    cmds:
      - CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go build {{.WINDOWS_LDFLAGS}} -o dist/{{.BINARY_NAME}}-windows-amd64.exe .

  build-windows-arm64:
    desc: Build for Windows ARM64
    deps: [assets]
    cmds:
      - CGO_ENABLED=0 GOOS=windows GOARCH=arm64 go build {{.WINDOWS_LDFLAGS}} -o dist/{{.BINARY_NAME}}-windows-arm64.exe .

  # ──────────────────────────────────────────────────────────────────────────
  # Build all platforms
  # ──────────────────────────────────────────────────────────────────────────
  build-all:
    desc: Build for all platforms
    deps: [clean]
    cmds:
      - mkdir -p dist
      - task: build-linux-amd64
      - task: build-linux-arm64
      - task: build-linux-desktop-amd64
      - task: build-linux-desktop-arm64
      - task: build-darwin-arm64
      - task: build-darwin-amd64
      - task: build-windows-amd64
      - task: build-windows-arm64
      - task: create-zips

  build-platforms:
    desc: "Alias for build-all"
    cmds: [task: build-all]

  # ──────────────────────────────────────────────────────────────────────────
  # macOS .app bundle packaging
  # ──────────────────────────────────────────────────────────────────────────
  package-darwin-arch:
    internal: true
    # MACOS_SIGN_IDENTITY (see .env.example) signs the app for release.
    dotenv: [".env"]
    cmds:
      - |
        APP="dist/LLM Router.app"
        rm -rf "$APP"
        mkdir -p "$APP/Contents/MacOS" "$APP/Contents/Resources"
        cp "dist/{{.BINARY_NAME}}-darwin-{{.DARWIN_ARCH}}" "$APP/Contents/MacOS/{{.BINARY_NAME}}"
        cp build/darwin/icon.icns "$APP/Contents/Resources/"
        cp build/darwin/Info.plist "$APP/Contents/"
        if command -v plutil >/dev/null 2>&1; then
          plutil -replace CFBundleVersion -string "{{.VERSION}}" "$APP/Contents/Info.plist"
          plutil -replace CFBundleShortVersionString -string "{{.VERSION}}" "$APP/Contents/Info.plist"
        fi
        if [ -n "$MACOS_SIGN_IDENTITY" ]; then
          # Developer ID signature for release: the hardened runtime and a
          # secure timestamp are required for notarization.
          codesign --force --timestamp --options runtime \
            --sign "$MACOS_SIGN_IDENTITY" "$APP" || exit 1
        else
          # Ad-hoc signature for local builds without a Developer ID
          codesign --force --deep --sign - "$APP" 2>/dev/null || true
        fi
        rm -f "dist/{{.BINARY_NAME}}-darwin-{{.DARWIN_ARCH}}.zip"
        cd dist && zip -r --symlinks "{{.BINARY_NAME}}-darwin-{{.DARWIN_ARCH}}.zip" "LLM Router.app"
        cd .. && rm -rf "$APP"

  notarize-macos:
    desc: Notarize the Developer ID signed LLM Router.app zips and staple the ticket to each app (NOTARY_* in .env)
    dotenv: [".env"]
    cmds:
      - |
        if [ -z "$NOTARY_KEY" ] || [ -z "$NOTARY_KEY_ID" ] || [ -z "$NOTARY_ISSUER" ]; then
          echo "NOTARY_KEY, NOTARY_KEY_ID and NOTARY_ISSUER must be set: see .env.example" >&2
          exit 1
        fi
        key=$NOTARY_KEY
        case $key in "~/"*) key="$HOME/${key#\~/}" ;; esac
        if [ ! -f "$key" ]; then
          echo "Notary API key not found: $key" >&2
          exit 1
        fi
        notary() {
          xcrun notarytool "$@" --key "$key" --key-id "$NOTARY_KEY_ID" --issuer "$NOTARY_ISSUER"
        }

        stage=$(mktemp -d "${TMPDIR:-/tmp}/llmrouter-notarize.XXXXXX") || exit 1
        trap 'rm -rf "$stage"' EXIT
        out="$PWD/dist"

        # Unpack each architecture's app and check it carries a Developer ID
        # signature before anything is sent to Apple.
        for arch in amd64 arm64; do
          zip="$out/{{.BINARY_NAME}}-darwin-${arch}.zip"
          mkdir -p "$stage/submit/$arch" || exit 1
          ditto -x -k "$zip" "$stage/submit/$arch" || exit 1
          if ! codesign -dvv "$stage/submit/$arch/LLM Router.app" 2>&1 | grep -q '^Authority=Developer ID Application'; then
            echo "$zip is not Developer ID signed: set MACOS_SIGN_IDENTITY in .env and rebuild (task build-all)" >&2
            exit 1
          fi
        done

        # One submission covers both apps: notarization is recorded per
        # binary, so each app's ticket can then be stapled separately.
        ditto -c -k --keepParent "$stage/submit" "$stage/submit.zip" || exit 1
        result=$(notary submit "$stage/submit.zip" --wait --output-format json) || true
        echo "$result"
        status=$(echo "$result" | jq -r '.status // empty')
        if [ "$status" != "Accepted" ]; then
          id=$(echo "$result" | jq -r '.id // empty')
          echo "Notarization failed (status: ${status:-unknown})" >&2
          if [ -n "$id" ]; then notary log "$id" >&2; fi
          exit 1
        fi

        # Staple the ticket into each app, so Gatekeeper accepts it offline
        # too, then repack the release zip with the stapled app.
        for arch in amd64 arm64; do
          app="$stage/submit/$arch/LLM Router.app"
          zip="$out/{{.BINARY_NAME}}-darwin-${arch}.zip"
          stapled=0
          # A freshly accepted ticket can take a few seconds to be served.
          for attempt in 1 2 3 4 5 6; do
            if xcrun stapler staple "$app"; then
              stapled=1
              break
            fi
            sleep 10
          done
          if [ "$stapled" -ne 1 ]; then
            echo "Could not staple the notarization ticket to the $arch app" >&2
            exit 1
          fi
          spctl --assess --type execute -vv "$app" || exit 1
          rm -f "$zip"
          # No extended attributes: ditto would store them (macOS tags every
          # file with com.apple.provenance) as AppleDouble ._ files. ditto -x
          # and casks merge those back, but unzip, which Homebrew formulae use,
          # leaves them inside the bundle and so breaks its signature seal.
          ditto -c -k --norsrc --noextattr --noacl --keepParent "$app" "$zip" || exit 1
          # Unpack the way a Homebrew formula does and check the seal holds.
          mkdir "$stage/check-$arch" || exit 1
          unzip -q "$zip" -d "$stage/check-$arch" || exit 1
          codesign --verify --strict "$stage/check-$arch/$(basename "$app")" || exit 1
        done

  # ──────────────────────────────────────────────────────────────────────────
  # Zip packaging
  # ──────────────────────────────────────────────────────────────────────────
  create-zips:
    desc: Create ZIP files for all platforms
    cmds:
      # macOS zips already created by package-darwin-arch (.app bundles)
      - cd dist && cp {{.BINARY_NAME}}-linux-amd64 {{.BINARY_NAME}} && zip {{.BINARY_NAME}}-linux-amd64.zip {{.BINARY_NAME}} && rm {{.BINARY_NAME}}
      - cd dist && cp {{.BINARY_NAME}}-linux-arm64 {{.BINARY_NAME}} && zip {{.BINARY_NAME}}-linux-arm64.zip {{.BINARY_NAME}} && rm {{.BINARY_NAME}}
      - cd dist && cp {{.BINARY_NAME}}-linux-desktop-amd64 {{.BINARY_NAME}} && zip {{.BINARY_NAME}}-linux-desktop-amd64.zip {{.BINARY_NAME}} && rm {{.BINARY_NAME}}
      - cd dist && cp {{.BINARY_NAME}}-linux-desktop-arm64 {{.BINARY_NAME}} && zip {{.BINARY_NAME}}-linux-desktop-arm64.zip {{.BINARY_NAME}} && rm {{.BINARY_NAME}}
      - cd dist && cp {{.BINARY_NAME}}-windows-amd64.exe {{.BINARY_NAME}}.exe && zip {{.BINARY_NAME}}-windows-amd64.zip {{.BINARY_NAME}}.exe && rm {{.BINARY_NAME}}.exe
      - cd dist && cp {{.BINARY_NAME}}-windows-arm64.exe {{.BINARY_NAME}}.exe && zip {{.BINARY_NAME}}-windows-arm64.zip {{.BINARY_NAME}}.exe && rm {{.BINARY_NAME}}.exe

  # ──────────────────────────────────────────────────────────────────────────
  # Release
  # ──────────────────────────────────────────────────────────────────────────
  release:
    desc: Tag version, build all platforms, create GitHub release + brew formulas
    deps: [build-all]
    cmds:
      # Before anything is tagged or published, so a rejection stops here.
      - task: notarize-macos
      - |
        if git tag -l v{{.VERSION}} | grep -q v{{.VERSION}}; then
          echo "Tag v{{.VERSION}} already exists, skipping tag creation"
        else
          echo "Creating tag v{{.VERSION}}"
          git tag -a v{{.VERSION}} -m "Release {{.VERSION}}"
          git push origin v{{.VERSION}}
        fi
        gh release create v{{.VERSION}} -t "Release {{.VERSION}}" -n "LLM Router {{.VERSION}}" dist/*.zip
      - task: homebrew-formula

  homebrew-formula:
    desc: Generate Homebrew formula and cask
    cmds:
      - go run ./scripts/homebrew-formula/ -out ../homebrew-tap

  # ──────────────────────────────────────────────────────────────────────────
  # Dev
  # ──────────────────────────────────────────────────────────────────────────
  run-server:
    desc: Run the server in development mode
    deps: [assets]
    cmds:
      - >-
        CGO_ENABLED=0 go run . server
        --allow-insecure
        --personas-dir ./examples/personas
        --commands-dir ./examples/commands
        --tools-dir ./examples/mcp-tools
        --resources-dir ./examples/resources
        --prompts-dir ./examples/prompts
        --skills-dir ./examples/skills
        --routes-dir ./examples/routers


  run-desktop:
    desc: Run the desktop app in development mode
    deps: [assets]
    cmds:
      # macOS requires the binary inside a .app bundle for NSApplication to
      # work. Build into a temp .app and open it. On Linux/Windows, go run
      # works directly.
      - CGO_ENABLED=0 go build -o /tmp/llmrouter-dev .
      - |
        if [ "{{OS}}" = "darwin" ]; then
          APP="/tmp/LLM Router Dev.app"
          mkdir -p "$APP/Contents/MacOS" "$APP/Contents/Resources"
          cp /tmp/llmrouter-dev "$APP/Contents/MacOS/llmrouter"
          cp build/darwin/Info.plist "$APP/Contents/"
          cp build/darwin/icon.icns "$APP/Contents/Resources/" 2>/dev/null || true
          open "$APP"
        else
          /tmp/llmrouter-dev \
            --personas-dir ./examples/personas \
            --commands-dir ./examples/commands \
            --resources-dir ./examples/resources \
            --prompts-dir ./examples/prompts
        --skills-dir ./examples/skills \
            --routes-dir ./examples/routers
        fi

  watch:
    desc: Watch for changes and rebuild
    cmds:
      - |
        while true; do
          fswatch -1 -e ".*" -i "\\.go$" .
          go build {{.LDFLAGS}} -o {{.BINARY_NAME}} .
          echo "Rebuilt at $(date)"
        done

  # ──────────────────────────────────────────────────────────────────────────
  # Container
  # ──────────────────────────────────────────────────────────────────────────
  container:
    desc: Build the docker image and push to Docker Hub
    method: none
    cmds:
      - |
        echo "Detected container runtime: {{.BUILD_WITH}}"
        echo "Building for platforms: {{.PLATFORM_ARG}}"
        if [ "{{.BUILD_WITH}}" = "podman" ]; then
          podman manifest create {{.REGISTRY}}/llmrouter:{{.VERSION}}
          podman build {{.PLATFORM_ARG}} --manifest {{.REGISTRY}}/llmrouter:{{.VERSION}} --build-arg VERSION={{.VERSION}} --build-arg DOCKER_HUB={{.HUB}} .
          podman tag {{.REGISTRY}}/llmrouter:{{.VERSION}} {{.REGISTRY}}/llmrouter:latest
          podman manifest push {{.REGISTRY}}/llmrouter:{{.VERSION}}
          podman manifest push {{.REGISTRY}}/llmrouter:latest
        else
          docker buildx build {{.PLATFORM_ARG}} --tag {{.REGISTRY}}/llmrouter:{{.VERSION}} --tag {{.REGISTRY}}/llmrouter:latest --build-arg VERSION={{.VERSION}} --build-arg DOCKER_HUB={{.HUB}} --push .
        fi

  container-local:
    desc: Build the docker image locally (no push)
    method: none
    cmds:
      - |
        echo "Detected container runtime: {{.BUILD_WITH}}"
        if [ "{{.BUILD_WITH}}" = "podman" ]; then
          podman build --tag {{.REGISTRY}}/llmrouter:{{.VERSION}} --tag {{.REGISTRY}}/llmrouter:latest --build-arg VERSION={{.VERSION}} --build-arg DOCKER_HUB={{.HUB}} .
        else
          docker build --tag {{.REGISTRY}}/llmrouter:{{.VERSION}} --tag {{.REGISTRY}}/llmrouter:latest --build-arg VERSION={{.VERSION}} --build-arg DOCKER_HUB={{.HUB}} .
        fi

  tag:
    desc: Tag the current code with the version and push to GitHub
    cmds:
      - git tag -a v{{.VERSION}} -m "Release {{.VERSION}}"
      - git push origin v{{.VERSION}}
    status:
      - git tag -l v{{.VERSION}}
