<!doctype html>
<html lang="en" x-data :class="{ 'dark': $store.darkMode.value }">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dashboard - LLM Router Admin</title>
    <link rel="stylesheet" href="{{.CSSFile}}" />
    <script type="module" src="{{.JSFile}}"></script>
  </head>
  <body class="min-h-screen bg-slate-100 dark:bg-slate-950 transition-colors duration-300">
    <div class="flex min-h-screen" x-data="dashboard()">
      <!-- Sidebar -->
      <aside class="w-64 bg-white dark:bg-slate-900 border-r border-slate-200 dark:border-slate-800 flex flex-col">
        <!-- Logo -->
        <div class="p-6 border-b border-slate-200 dark:border-slate-800">
          <div class="flex items-center gap-3">
            <div class="w-10 h-10 rounded-xl bg-gradient-to-br from-blue-500 to-indigo-600 flex items-center justify-center shadow-lg shadow-blue-500/25">
              <svg class="w-5 h-5 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 3v2m6-2v2M9 19v2m6-2v2M5 9H3m2 6H3m18-6h-2m2 6h-2M7 19h10a2 2 0 002-2V7a2 2 0 00-2-2H7a2 2 0 00-2 2v10a2 2 0 002 2zM9 9h6v6H9V9z" />
              </svg>
            </div>
            <div>
              <h1 class="font-bold text-slate-900 dark:text-white">LLM Router</h1>
              <p class="text-xs text-slate-500 dark:text-slate-400">Admin Dashboard</p>
            </div>
          </div>
        </div>

        <!-- Navigation -->
        <nav class="flex-1 p-4 space-y-1">
          <a href="/admin/" class="nav-link nav-link-active">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6" />
            </svg>
            <span>Dashboard</span>
          </a>
          <a href="/admin/models" class="nav-link">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2" />
            </svg>
            <span>Models</span>
          </a>
          <a href="/admin/mcp-servers" class="nav-link">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 12h14M5 12a2 2 0 01-2-2V6a2 2 0 012-2h14a2 2 0 012 2v4a2 2 0 01-2 2M5 12a2 2 0 00-2 2v4a2 2 0 002 2h14a2 2 0 002-2v-4a2 2 0 00-2-2m-2-4h.01M17 16h.01" />
            </svg>
            <span>MCP Servers</span>
          </a>

        </nav>

        <!-- Footer actions -->
        <div class="p-4 border-t border-slate-200 dark:border-slate-800 space-y-2">
          <button
            @click="$store.darkMode.toggle()"
            class="w-full nav-link justify-start"
          >
            <svg x-show="!$store.darkMode.value" class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z" />
            </svg>
            <svg x-show="$store.darkMode.value" class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z" />
            </svg>
            <span x-text="$store.darkMode.value ? 'Light Mode' : 'Dark Mode'"></span>
          </button>
          <button @click="logout" class="w-full nav-link justify-start text-red-600 dark:text-red-400 hover:bg-red-50 dark:hover:bg-red-900/20">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1" />
            </svg>
            <span>Logout</span>
          </button>
        </div>
      </aside>

      <!-- Main content -->
      <main class="flex-1 p-8">
        <div class="max-w-6xl mx-auto">
          <!-- Header -->
          <div class="mb-8">
            <h2 class="text-2xl font-bold text-slate-900 dark:text-white">Dashboard</h2>
            <p class="text-slate-600 dark:text-slate-400 mt-1">Overview of your LLM Router instance</p>
          </div>

          <!-- Loading state -->
          <div x-show="loading" class="flex items-center justify-center py-16">
            <div class="animate-spin rounded-full h-12 w-12 border-b-2 border-blue-500"></div>
          </div>

          <!-- Error state -->
          <div x-show="error && !loading" class="card bg-red-50 dark:bg-red-900/30 border-red-200 dark:border-red-800">
            <p class="text-red-700 dark:text-red-400" x-text="error"></p>
          </div>

          <!-- Content -->
          <div x-show="!loading && !error">
            <!-- Stats grid -->
            <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-6 mb-8" x-show="stats">
              <div class="card">
                <div class="flex items-center gap-4">
                  <div class="w-12 h-12 rounded-xl bg-blue-100 dark:bg-blue-900/30 flex items-center justify-center">
                    <svg class="w-6 h-6 text-blue-600 dark:text-blue-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0 00-2-2M5 11V9a2 2 0 012-2m0 0V5a2 2 0 012-2h6a2 2 0 012 2v2M7 7h10" />
                    </svg>
                  </div>
                  <div>
                    <p class="text-sm text-slate-600 dark:text-slate-400">Providers</p>
                    <p class="text-2xl font-bold text-slate-900 dark:text-white" x-text="stats?.providers || 0"></p>
                  </div>
                </div>
              </div>

              <div class="card">
                <div class="flex items-center gap-4">
                  <div class="w-12 h-12 rounded-xl bg-green-100 dark:bg-green-900/30 flex items-center justify-center">
                    <svg class="w-6 h-6 text-green-600 dark:text-green-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2" />
                    </svg>
                  </div>
                  <div>
                    <p class="text-sm text-slate-600 dark:text-slate-400">Models</p>
                    <p class="text-2xl font-bold text-slate-900 dark:text-white" x-text="stats?.models || 0"></p>
                  </div>
                </div>
              </div>

              <div class="card">
                <div class="flex items-center gap-4">
                  <div class="w-12 h-12 rounded-xl bg-purple-100 dark:bg-purple-900/30 flex items-center justify-center">
                    <svg class="w-6 h-6 text-purple-600 dark:text-purple-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 12h14M5 12a2 2 0 01-2-2V6a2 2 0 012-2h14a2 2 0 012 2v4a2 2 0 01-2 2M5 12a2 2 0 00-2 2v4a2 2 0 002 2h14a2 2 0 002-2v-4a2 2 0 00-2-2m-2-4h.01M17 16h.01" />
                    </svg>
                  </div>
                  <div>
                    <p class="text-sm text-slate-600 dark:text-slate-400">MCP Servers</p>
                    <p class="text-2xl font-bold text-slate-900 dark:text-white" x-text="stats?.mcp_servers || 0"></p>
                  </div>
                </div>
              </div>

              <div class="card">
                <div class="flex items-center gap-4">
                  <div class="w-12 h-12 rounded-xl bg-amber-100 dark:bg-amber-900/30 flex items-center justify-center">
                    <svg class="w-6 h-6 text-amber-600 dark:text-amber-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z" />
                    </svg>
                  </div>
                  <div>
                    <p class="text-sm text-slate-600 dark:text-slate-400">Active Requests</p>
                    <p class="text-2xl font-bold text-slate-900 dark:text-white" x-text="stats?.active_requests || 0"></p>
                  </div>
                </div>
              </div>
            </div>

            <!-- Providers list -->
            <div class="card">
              <h3 class="text-lg font-semibold text-slate-900 dark:text-white mb-4">Providers</h3>
              <div class="space-y-3">
                <template x-for="provider in providers" :key="provider.name">
                  <div
                    class="flex items-center justify-between p-4 bg-slate-100 dark:bg-slate-700 rounded-xl cursor-pointer hover:bg-slate-200 dark:hover:bg-slate-600 transition-colors"
                    @click="viewProviderModels(provider)"
                  >
                    <div class="flex items-center gap-3">
                      <div
                        class="w-3 h-3 rounded-full"
                        :class="provider.healthy ? 'bg-green-500' : 'bg-red-500'"
                      ></div>
                      <div>
                        <p class="font-medium text-slate-900 dark:text-white" x-text="provider.name"></p>
                        <p class="text-sm text-slate-500 dark:text-slate-400" x-text="provider.type"></p>
                      </div>
                    </div>
                    <div class="text-right">
                      <p class="text-sm text-slate-600 dark:text-slate-400">
                        <span x-text="provider.model_count"></span> models
                      </p>
                      <p class="text-xs text-slate-500 dark:text-slate-400">
                        Weight: <span x-text="provider.weight"></span>
                      </p>
                    </div>
                  </div>
                </template>
                <div x-show="providers.length === 0" class="text-center py-8 text-slate-500 dark:text-slate-400">
                  No providers configured
                </div>
              </div>
            </div>
          </div>
        </div>
      </main>

      <!-- Provider Models Modal -->
      <div
        x-show="showModelsModal"
        x-transition.opacity
        class="fixed inset-0 bg-black/50 flex items-center justify-center z-50 p-4"
        @click.self="showModelsModal = false"
      >
        <div class="bg-white dark:bg-slate-900 rounded-2xl shadow-2xl w-full max-w-lg max-h-[80vh] flex flex-col">
          <div class="flex items-center justify-between p-6 border-b border-slate-200 dark:border-slate-700">
            <div>
              <h3 class="text-lg font-semibold text-slate-900 dark:text-white" x-text="selectedProvider?.name"></h3>
              <p class="text-sm text-slate-500 dark:text-slate-400" x-text="providerModels.length + ' models'"></p>
            </div>
            <button @click="showModelsModal = false" class="text-slate-400 hover:text-slate-600 dark:hover:text-slate-200 cursor-pointer">
              <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
              </svg>
            </button>
          </div>
          <div class="overflow-y-auto flex-1 p-4 space-y-1">
            <template x-for="model in providerModels" :key="model.id">
              <div class="px-3 py-2 rounded-lg bg-slate-50 dark:bg-slate-800 text-sm text-slate-700 dark:text-slate-300 font-mono" x-text="model.id"></div>
            </template>
            <div x-show="providerModels.length === 0" class="text-center py-8 text-slate-500 dark:text-slate-400 text-sm">No models</div>
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
