<!doctype html>
<html lang="en" x-data :class="{ 'dark': $store.darkMode.value }">
  <head>
    <script>(()=>{if(localStorage.getItem('darkMode')==='true')document.documentElement.classList.add('dark')})()</script>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Chat - LLM Router</title>
    <link rel="stylesheet" href="{{.CSSFile}}" />
    <!-- Order matters: chat.js bundles the markdown processor +
         Alpine component and registers an alpine:init listener that
         must be in place BEFORE the host bundle calls Alpine.start().
         Defer preserves document order, so chat.js → host bundle. -->
    <script defer src="{{.Prefix}}/assets/chat.js"></script>
    <script type="module" src="{{.JSFile}}"></script>
    <style>
      [x-cloak] { display: none !important; }

      /* Locally-defined keyframes. Tailwind v4 doesn't ship animate-bounce
         unless it sees the class during source scan, and we want these
         guaranteed regardless of host build. */
      @keyframes webchat-blink {
        0%, 49% { opacity: 1; }
        50%, 100% { opacity: 0; }
      }
      .animate-blink { animation: webchat-blink 1s steps(1, end) infinite; }

      @keyframes webchat-bounce {
        0%, 100% { transform: translateY(-25%); animation-timing-function: cubic-bezier(0.8, 0, 1, 1); }
        50%      { transform: none;             animation-timing-function: cubic-bezier(0, 0, 0.2, 1); }
      }
      .webchat-bounce { animation: webchat-bounce 1s infinite; }

      /* Markdown content styling — processMarkdown emits semantic
         .md-* classes (defined here), not Tailwind utilities, so the
         output works regardless of whether the host's Tailwind build
         happens to have scanned those classes. Dark mode keys off the
         host's `.dark` class on <html>, which is how the rest of the
         app toggles dark mode. */
      .prose-chat { line-height: 1.55; word-break: break-word; color: #0f172a; }
      .dark .prose-chat { color: #f1f5f9; }
      .prose-chat > :first-child { margin-top: 0; }
      .prose-chat > :last-child { margin-bottom: 0; }
      .prose-chat p { margin: 0.5em 0; }
      .prose-chat a, .md-a { color: #3b82f6; text-decoration: underline; word-break: break-all; }
      .md-a:hover { color: #1d4ed8; }
      .prose-chat code, .prose-chat pre, .md-code, .md-pre code {
        font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
      }
      .prose-chat ul, .prose-chat ol { margin: 0.5em 0; padding-left: 1.5em; }
      .prose-chat li { margin: 0.25em 0; }
      .prose-chat blockquote, .prose-chat pre, .prose-chat table, .prose-chat hr { margin: 0.5em 0; }
      .prose-chat hr { border: 0; border-top: 1px solid #cbd5e1; }
      .dark .prose-chat hr { border-top-color: #475569; }

      /* Headings — explicit colour so dark mode actually flips them. */
      .md-h1 { font-size: 1.875rem; font-weight: 700; color: #0f172a; margin: 1rem 0 0.5rem; }
      .md-h2 { font-size: 1.5rem;  font-weight: 600; color: #0f172a; margin: 1rem 0 0.5rem; }
      .md-h3 { font-size: 1.25rem; font-weight: 600; color: #0f172a; margin: 1rem 0 0.5rem; }
      .md-h4 { font-size: 1.125rem; font-weight: 600; color: #0f172a; margin: 1rem 0 0.5rem; }
      .md-h5 { font-size: 1rem;    font-weight: 600; color: #0f172a; margin: 1rem 0 0.5rem; }
      .md-h6 { font-size: 0.875rem; font-weight: 600; color: #0f172a; margin: 1rem 0 0.5rem; }
      .dark .md-h1, .dark .md-h2, .dark .md-h3,
      .dark .md-h4, .dark .md-h5, .dark .md-h6 { color: #f1f5f9; }

      /* Inline + block code. */
      .md-code {
        background: #f1f5f9; padding: 0.125rem 0.25rem; border-radius: 0.25rem;
        font-size: 0.875rem;
      }
      .dark .md-code { background: #0f172a; border: 1px solid #334155; }
      .md-pre {
        background: #f1f5f9; border: 1px solid #e2e8f0; padding: 0.75rem;
        border-radius: 0.375rem; overflow-x: auto; margin: 0.5rem 0;
      }
      .dark .md-pre { background: #0f172a; border-color: #334155; }
      .md-pre code { font-size: 0.875rem; background: transparent; padding: 0; border: 0; }

      /* Blockquotes. */
      .md-blockquote {
        border-left: 4px solid #cbd5e1; padding: 0.5rem 1rem; margin: 0.5rem 0;
        background: #f8fafc; font-style: italic; color: #475569;
      }
      .dark .md-blockquote { border-left-color: #475569; background: #1e293b; color: #cbd5e1; }

      /* Horizontal rules. */
      .md-hr { border: 0; border-top: 1px solid #cbd5e1; margin: 1rem 0; }
      .dark .md-hr { border-top-color: #475569; }

      /* Lists. */
      .md-list { margin: 0.5rem 0; padding-left: 1.5rem; }
      .md-list li { margin: 0.25rem 0; }

      /* Tables. */
      .md-table-wrap { overflow-x: auto; margin: 0.5rem 0; }
      .md-table { width: 100%; border-collapse: collapse; }
      .md-thead { background: #f8fafc; }
      .dark .md-thead { background: #1e293b; }
      .md-th, .md-td { border: 1px solid #cbd5e1; padding: 0.5rem 0.75rem; text-align: left; }
      .dark .md-th, .dark .md-td { border-color: #475569; }
      .md-th { font-weight: 600; }
      .md-tr:nth-child(even) { background: #f8fafc; }
      .dark .md-tr:nth-child(even) { background: #1e293b; }

      /* Slim scrollbars in the chat transcript. */
      .wc-messages::-webkit-scrollbar { width: 6px; }
      .wc-messages::-webkit-scrollbar-thumb { background-color: rgb(148 163 184 / 0.4); border-radius: 3px; }
      .wc-messages::-webkit-scrollbar-track { background: transparent; }

      /* Responsive layout is in main.css (.wc-nav-links, .wc-hamburger,
         .wc-mobile-panel). The chat-specific .wc-sidebar class is also
         there since the media-query rules are shared. */
    </style>
  </head>
  <body class="min-h-screen bg-slate-100 dark:bg-slate-950 transition-colors duration-300">
    <div x-data="webchat({ prefix: '{{.Prefix}}' })" x-init="init()" x-cloak>
      <!-- Mobile menu state is host-owned (not webchat) because the nav
           links + layout are app-specific. Wrapped in its own x-data so
           it doesn't pollute the webchat component scope. -->
      <div x-data="{ mobileMenuOpen: false }">
      <!-- Top nav -->
      <header class="sticky top-0 z-40 bg-white dark:bg-slate-900 border-b border-slate-200 dark:border-slate-800 shadow-sm">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 h-16 flex items-center justify-between">
          <div class="flex items-center gap-3">
            <!-- Hamburger (mobile only, hidden on desktop via .wc-hamburger) -->
            <button class="wc-hamburger items-center justify-center p-2 rounded-lg text-slate-600 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-800 cursor-pointer"
                    @click="mobileMenuOpen = true" aria-label="Open menu">
              <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16" />
              </svg>
            </button>
            <!-- Logo -->
            <a href="/admin/" class="flex items-center gap-3">
              <div class="w-8 h-8 rounded-lg bg-gradient-to-br from-blue-500 to-indigo-600 flex items-center justify-center shadow shadow-blue-500/25">
                <svg class="w-4 h-4 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 3v2m6-2v2M9 19v2m6-2v2M5 9H3m2 6H3m18-6h-2m2 6h-2M7 19h10a2 2 0 002-2V7a2 2 0 00-2-2H7a2 2 0 00-2 2v10a2 2 0 002 2zM9 9h6v6H9V9z" />
                </svg>
              </div>
              <span class="font-bold text-slate-900 dark:text-white">LLM Router</span>
            </a>
          </div>
          <!-- Desktop nav (hidden on mobile via .wc-nav-links) -->
          <div class="flex items-center gap-1">
            <nav class="wc-nav-links flex items-center gap-1">
              <a href="/admin/" class="nav-link">Dashboard</a>
              <a href="/chat" class="nav-link nav-link-active">Chat</a>
              <a href="/admin/models" class="nav-link">Models</a>
              <a href="/admin/mcp-servers" class="nav-link">MCP Servers</a>
            </nav>
            <div class="w-px h-5 bg-slate-200 dark:bg-slate-700 mx-2"></div>
            <button @click="$store.darkMode.toggle()" class="nav-link cursor-pointer" aria-label="Toggle dark mode" title="Toggle dark mode">
              <svg x-show="!$store.darkMode.value" class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z" /></svg>
              <svg x-show="$store.darkMode.value" class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z" /></svg>
            </button>
            <button @click="fetch('/admin/api/logout', {method:'POST'}).finally(() => window.location.href='/admin/login')"
                    class="nav-link cursor-pointer text-red-600 dark:text-red-400 hover:bg-red-50 dark:hover:bg-red-900/20">
              <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1" /></svg>
              Logout
            </button>
          </div>
        </div>
      </header>

      <!-- Mobile slide-in panel (hidden on desktop via .wc-mobile-panel CSS).
           Nav links are app-specific. Chat history list is read from the
           parent webchat scope so conversations are shared. -->
      <div class="wc-mobile-panel" x-show="mobileMenuOpen" x-cloak>
        <!-- Backdrop -->
        <div @click="mobileMenuOpen = false" style="position:fixed;inset:0;background:rgba(0,0,0,0.5);z-index:45;"></div>
        <!-- Panel -->
        <div style="position:fixed;top:0;bottom:0;left:0;width:18rem;max-width:80vw;z-index:50;overflow-y:auto;" class="bg-white dark:bg-slate-900 border-r border-slate-200 dark:border-slate-800">
          <!-- Header row -->
          <div class="flex items-center justify-between px-4 py-3 border-b border-slate-200 dark:border-slate-800">
            <span class="font-bold text-slate-900 dark:text-white">Menu</span>
            <button @click="mobileMenuOpen = false" class="p-1 text-slate-500 hover:text-slate-700 dark:text-slate-400 dark:hover:text-slate-200 cursor-pointer" aria-label="Close menu">
              <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" /></svg>
            </button>
          </div>
          <!-- Nav links (app-specific) -->
          <nav class="flex flex-col gap-1 px-3 py-3">
            <a href="/admin/" class="px-3 py-2 rounded-lg text-sm text-slate-600 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-800">Dashboard</a>
            <a href="/chat" class="px-3 py-2 rounded-lg text-sm bg-blue-50 dark:bg-blue-900/30 text-blue-700 dark:text-blue-300">Chat</a>
            <a href="/admin/models" class="px-3 py-2 rounded-lg text-sm text-slate-600 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-800">Models</a>
            <a href="/admin/mcp-servers" class="px-3 py-2 rounded-lg text-sm text-slate-600 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-800">MCP Servers</a>
          </nav>
          <!-- Chat history (reads from the webchat parent scope) -->
          <div class="border-t border-slate-200 dark:border-slate-800 px-3 py-3">
            <button @click="newChat(); mobileMenuOpen = false" class="w-full mb-3 px-3 py-2 rounded-lg bg-blue-600 hover:bg-blue-700 text-white text-sm font-medium cursor-pointer flex items-center justify-center gap-2">
              <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4" /></svg>
              New Chat
            </button>
            <div class="space-y-1 overflow-y-auto" style="max-height: 40vh;">
              <template x-for="c in conversations" :key="c.id">
                <button @click="loadConversation(c.id); mobileMenuOpen = false"
                        class="w-full text-left px-3 py-2 rounded-lg text-sm"
                        :class="c.id === currentId ? 'bg-blue-50 dark:bg-blue-900/30 text-blue-700 dark:text-blue-300' : 'text-slate-600 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-800'"
                        x-text="c.title || 'New conversation'"></button>
              </template>
              <p x-show="conversations.length === 0" class="text-xs text-slate-400 dark:text-slate-500 px-3 py-2">No saved conversations.</p>
            </div>
          </div>
        </div>
      </div>
      </div><!-- /mobileMenuOpen scope -->

      <main class="max-w-7xl mx-auto px-4 sm:px-6 py-6 h-[calc(100vh-4rem)] flex">
        <!-- Sidebar: conversation list + new chat. Visible on desktop via
             .wc-sidebar CSS, hidden on mobile (content moves into the
             hamburger slide-in panel above). -->
        <aside class="wc-sidebar w-64 shrink-0 flex-col border-r border-slate-200 dark:border-slate-800 pr-4">
          <button @click="newChat()"
                  class="w-full mb-4 px-3 py-2 rounded-lg bg-blue-600 hover:bg-blue-700 text-white text-sm font-medium transition-colors cursor-pointer flex items-center justify-center gap-2">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4" /></svg>
            New Chat
          </button>
          <div class="flex-1 overflow-y-auto space-y-1">
            <template x-for="c in conversations" :key="c.id">
              <button @click="loadConversation(c.id)"
                      class="w-full text-left px-3 py-2 rounded-lg text-sm transition-colors"
                      :class="c.id === currentId ? 'bg-blue-50 dark:bg-blue-900/30 text-blue-700 dark:text-blue-300' : 'text-slate-600 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-800'"
                      x-text="c.title || 'New conversation'"></button>
            </template>
            <p x-show="conversations.length === 0" class="text-xs text-slate-400 dark:text-slate-500 px-3 py-2">No saved conversations.</p>
          </div>
        </aside>

        <!-- Chat column -->
        <section class="flex-1 flex flex-col min-w-0 pl-0 md:pl-6">
          <!-- Empty / setup state -->
          <div x-show="!currentId" class="flex-1 flex items-start justify-center overflow-y-auto py-6">
            <div class="max-w-lg w-full my-auto bg-white dark:bg-slate-900 rounded-2xl shadow-sm border border-slate-200 dark:border-slate-700 p-6">
              <h2 class="text-xl font-semibold text-slate-900 dark:text-white mb-1">Start a new chat</h2>
              <p class="text-sm text-slate-500 dark:text-slate-400 mb-5">Pick a persona and a model to begin.</p>

              <!-- Persona: searchable dropdown -->
              <label class="block text-sm font-medium text-slate-700 dark:text-slate-300 mb-1.5">Persona</label>
              <div class="relative mb-1">
                <input type="text"
                       x-model="setupPersonaSearch"
                       @focus="setupPersonaOpen = true; setupPersonaIndex = 0"
                       @keydown="onSetupPersonaKeydown($event)"
                       @input="setupPersonaOpen = true; setupPersonaIndex = 0"
                       @blur="setTimeout(() => setupPersonaOpen = false, 150)"
                       :placeholder="personas.find(p => p.id === setupPersonaId)?.name || 'Search personas...'"
                       class="input-field" />
                <!-- Dropdown -->
                <div x-show="setupPersonaOpen && setupPersonaMatches.length > 0" x-cloak
                     class="absolute z-20 left-0 right-0 mt-1 bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-lg shadow-lg max-h-52 overflow-y-auto">
                  <template x-for="(p, i) in setupPersonaMatches" :key="p.id">
                    <button type="button"
                            @click="selectSetupPersona(p)"
                            @mouseenter="setupPersonaIndex = i"
                            class="w-full text-left px-3 py-2 text-sm flex items-start gap-2 transition-colors cursor-pointer"
                            :class="i === setupPersonaIndex ? 'bg-blue-50 dark:bg-blue-900/30' : 'hover:bg-slate-50 dark:hover:bg-slate-700/50'">
                      <div class="flex-1 min-w-0">
                        <div class="font-medium text-slate-900 dark:text-white" x-text="p.name"></div>
                        <div x-show="p.description" class="text-xs text-slate-500 dark:text-slate-400 truncate" x-text="p.description"></div>
                      </div>
                    </button>
                  </template>
                </div>
              </div>
              <p x-show="personas.find(p => p.id === setupPersonaId)?.description" class="text-xs text-slate-500 dark:text-slate-400 mb-4" x-text="personas.find(p => p.id === setupPersonaId)?.description"></p>

              <!-- Model: searchable dropdown -->
              <label class="block text-sm font-medium text-slate-700 dark:text-slate-300 mb-1.5 mt-4">Model</label>
              <div class="relative mb-1">
                <input type="text"
                       x-model="setupModelSearch"
                       @focus="setupModelOpen = true; setupModelIndex = 0"
                       @keydown="onSetupModelKeydown($event)"
                       @input="setupModelOpen = true; setupModelIndex = 0"
                       @blur="setTimeout(() => setupModelOpen = false, 150)"
                       :placeholder="setupModel || 'Search models...'"
                       class="input-field" />
                <div x-show="setupModelOpen && setupModelMatches.length > 0" x-cloak
                     class="absolute z-20 left-0 right-0 mt-1 bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-lg shadow-lg max-h-52 overflow-y-auto">
                  <template x-for="(m, i) in setupModelMatches" :key="m.id">
                    <button type="button"
                            @click="selectSetupModel(m)"
                            @mouseenter="setupModelIndex = i"
                            class="w-full text-left px-3 py-2 text-sm flex items-center gap-2 transition-colors cursor-pointer"
                            :class="i === setupModelIndex ? 'bg-blue-50 dark:bg-blue-900/30' : 'hover:bg-slate-50 dark:hover:bg-slate-700/50'">
                      <span class="font-mono text-xs text-slate-900 dark:text-white" x-text="m.id"></span>
                      <span x-show="m.provider" class="text-xs text-slate-400" x-text="m.provider"></span>
                    </button>
                  </template>
                </div>
              </div>

              <!-- Parameters grid -->
              <div class="mt-5">
                <p class="text-sm font-medium text-slate-700 dark:text-slate-300 mb-2.5">Parameters <span class="text-xs text-slate-400 font-normal">(optional — from persona, override as needed)</span></p>
                <div class="grid grid-cols-2 gap-x-4 gap-y-3">
                  <div>
                    <label class="block text-xs text-slate-500 dark:text-slate-400 mb-0.5">Temperature</label>
                    <input type="number" step="0.05" x-model.number="setupParams.temperature" placeholder="default" class="input-field text-sm py-1.5" />
                  </div>
                  <div>
                    <label class="block text-xs text-slate-500 dark:text-slate-400 mb-0.5">Top P</label>
                    <input type="number" step="0.05" x-model.number="setupParams.top_p" placeholder="default" class="input-field text-sm py-1.5" />
                  </div>
                  <div>
                    <label class="block text-xs text-slate-500 dark:text-slate-400 mb-0.5">Top K</label>
                    <input type="number" step="1" x-model.number="setupParams.top_k" placeholder="default" class="input-field text-sm py-1.5" />
                  </div>
                  <div>
                    <label class="block text-xs text-slate-500 dark:text-slate-400 mb-0.5">Repeat Penalty</label>
                    <input type="number" step="0.05" x-model.number="setupParams.repeat_penalty" placeholder="default" class="input-field text-sm py-1.5" />
                  </div>
                  <div>
                    <label class="block text-xs text-slate-500 dark:text-slate-400 mb-0.5">Context Length</label>
                    <input type="number" step="512" x-model.number="setupParams.context_length" placeholder="default" class="input-field text-sm py-1.5" />
                  </div>
                  <div>
                    <label class="block text-xs text-slate-500 dark:text-slate-400 mb-0.5">Output Length</label>
                    <input type="number" step="256" x-model.number="setupParams.max_tokens" placeholder="default" class="input-field text-sm py-1.5" />
                  </div>
                </div>
              </div>

              <button @click="startChat()"
                      :disabled="!setupModel"
                      class="w-full mt-6 px-4 py-2 rounded-lg bg-blue-600 hover:bg-blue-700 disabled:bg-slate-300 dark:disabled:bg-slate-700 disabled:cursor-not-allowed text-white text-sm font-medium transition-colors cursor-pointer">
                Start chat
              </button>
            </div>
          </div>

          <!-- Active chat -->
          <div x-show="currentId" class="flex-1 flex flex-col min-h-0">
            <!-- Chat header: persona/model + tool availability -->
            <div class="flex items-center justify-between mb-4 px-1">
              <div class="flex items-center gap-3 min-w-0">
                <span class="text-sm font-medium text-slate-900 dark:text-white truncate" x-text="currentPersonaName"></span>
                <span class="text-xs text-slate-400 dark:text-slate-500 truncate" x-text="currentModel"></span>
              </div>
              <div class="flex items-center gap-2">
                <button @click="showToolsPanel = !showToolsPanel"
                        class="text-xs px-2 py-1 rounded-md text-slate-600 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-800 transition-colors cursor-pointer"
                        :class="{ 'bg-blue-50 dark:bg-blue-900/30 text-blue-700 dark:text-blue-300': showToolsPanel }"
                        x-text="enabledToolsCount + ' tools'"></button>
                <button @click="deleteCurrent()" title="Delete chat"
                        class="p-1 text-slate-400 hover:text-red-600 dark:hover:text-red-300 transition-colors cursor-pointer">
                  <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" /></svg>
                </button>
              </div>
            </div>

            <!-- Tools side panel -->
            <div x-show="showToolsPanel" x-transition class="mb-4 p-3 rounded-xl bg-slate-50 dark:bg-slate-800/50 border border-slate-200 dark:border-slate-700 max-h-48 overflow-y-auto">
              <div class="flex items-center justify-between mb-2">
                <span class="text-xs font-semibold text-slate-600 dark:text-slate-300 uppercase tracking-wide">Tools</span>
                <label class="text-xs flex items-center gap-1 text-slate-500 dark:text-slate-400 cursor-pointer">
                  <input type="checkbox" @change="toggleAllTools($event)" :checked="enabledToolsCount === allTools.length" class="sr-only peer" />
                  <span class="relative w-4 h-2 bg-slate-300 dark:bg-slate-600 rounded-full peer-checked:bg-blue-500 after:content-[''] after:absolute after:top-0 after:left-0 after:w-2 after:h-2 after:rounded-full after:bg-white after:transition-all peer-checked:after:translate-x-2"></span>
                  All
                </label>
              </div>
              <div class="space-y-1">
                <template x-for="t in allTools" :key="t.name">
                  <label class="flex items-center gap-2 text-xs cursor-pointer">
                    <input type="checkbox" :value="t.name" x-model="enabledTools" class="rounded border-slate-300 dark:border-slate-600 text-blue-600 focus:ring-blue-500" />
                    <span class="font-mono text-slate-700 dark:text-slate-300 truncate" x-text="t.name"></span>
                  </label>
                </template>
                <p x-show="allTools.length === 0" class="text-xs text-slate-400 dark:text-slate-500">No tools available.</p>
              </div>
            </div>

            <!-- Messages -->
            <div x-ref="messages" @wheel.passive="onWheel($event)"
                 class="wc-messages flex-1 overflow-y-auto space-y-4 pr-1 relative">
              <template x-for="(m, idx) in messages" :key="m.id">
                <!-- Skip tool-role messages from the main loop. Their result
                     is rendered inline within the originating assistant
                     bubble's Tool calls disclosure (call.result), so showing
                     them again here would just duplicate the output as a
                     flat bubble below the call card. The data stays in
                     messages[] so the model still sees the result in context
                     on the next turn. -->
                <template x-if="m.role !== 'tool' && m.role !== 'system'">
                <div class="flex" :class="m.role === 'user' ? 'justify-end' : 'justify-start'">
                  <div class="w-full rounded-2xl px-4 py-2 text-sm transition-shadow"
                       :class="[
                         m.role === 'user'
                           ? 'bg-blue-50 dark:bg-blue-900/30 text-slate-900 dark:text-blue-50 border border-blue-200 dark:border-blue-800'
                           : 'bg-white dark:bg-slate-800 text-slate-900 dark:text-white border border-slate-200 dark:border-slate-700',
                         // While this assistant bubble is the one streaming,
                         // give it a soft blue glow so the user's eye tracks
                         // where new content is appearing.
                         (streaming && idx === messages.length - 1) ? 'shadow-md shadow-blue-500/10 border-blue-300 dark:border-blue-700' : ''
                       ]">
                    <!-- ====== THINKING (always CLOSED by default; user
                         clicks to expand/collapse manually). No auto-open
                         during streaming — the collapsed header is enough
                         to signal that reasoning content is available. ====== -->
                    <div x-show="m.role === 'assistant' && m.thinking && m.thinking.trim()"
                         x-data="{ open: false }"
                         class="rounded-lg border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-900/40 overflow-hidden mb-3">
                      <button @click="open = !open" type="button" class="w-full flex items-center gap-2 px-3 py-2 text-xs font-medium text-slate-600 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-800 transition-colors">
                        <svg class="w-3.5 h-3.5 text-slate-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9.663 17h4.673M12 3v1m6.364 1.636l-.707.707M21 12h-1M4 12H3m3.343-5.657l-.707-.707m2.828 9.9a5 5 0 117.072 0l-.548.547A3.374 3.374 0 0014 18.469V19a2 2 0 11-4 0v-.531c0-.895-.356-1.754-.988-2.386l-.548-.547z" />
                        </svg>
                        <span>Thinking</span>
                        <svg class="w-3 h-3 ml-auto transition-transform" :class="{ 'rotate-180': open }" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7" />
                        </svg>
                      </button>
                      <div x-show="open" x-transition.opacity
                           class="px-3 pb-3 pt-1 text-xs text-slate-600 dark:text-slate-300 border-t border-slate-200 dark:border-slate-700 whitespace-pre-wrap font-mono leading-relaxed"
                           x-text="m.thinking"></div>
                    </div>

                    <!-- ====== TOOL CALLS (collapsed by default). Each call
                         shows name + args + result. Approval buttons live
                         in a separate section at the bottom of the bubble
                         so they're always reachable even when this block
                         is collapsed. ====== -->
                    <template x-if="m.role === 'assistant' && m.tool_calls && m.tool_calls.length > 0">
                      <div x-data="{ open: false }" class="mb-3">
                        <button @click="open = !open" type="button"
                                class="w-full flex items-center gap-2 text-xs font-medium text-slate-600 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-800 rounded p-1.5 transition-colors">
                          <svg class="w-3.5 h-3.5 transition-transform" :class="open ? 'rotate-90' : ''" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7" />
                          </svg>
                          <span x-text="m.tool_calls.length + ' tool call' + (m.tool_calls.length === 1 ? '' : 's')"></span>
                          <span class="ml-auto flex items-center gap-1 text-[10px]">
                            <span class="px-1.5 py-0.5 rounded bg-slate-200 dark:bg-slate-700 text-slate-600 dark:text-slate-300"
                                  x-text="m.tool_calls.filter(c => c.approval === 'approved').length + ' ok'"></span>
                            <span x-show="m.tool_calls.some(c => c.approval === 'denied' || c.approval === 'error')"
                                  class="px-1.5 py-0.5 rounded bg-red-100 dark:bg-red-900/40 text-red-700 dark:text-red-300">issues</span>
                          </span>
                        </button>
                        <div x-show="open" x-transition.opacity class="mt-2 space-y-2">
                          <template x-for="call in m.tool_calls" :key="call.id">
                            <div class="border border-slate-200 dark:border-slate-700 rounded-lg overflow-hidden">
                              <div class="bg-slate-50 dark:bg-slate-900/40 border-b border-slate-200 dark:border-slate-700 px-3 py-2 flex items-center gap-2">
                                <code class="bg-blue-100 dark:bg-blue-800 px-2 py-0.5 rounded text-xs font-mono text-blue-700 dark:text-blue-300" x-text="call.name"></code>
                                <span class="text-[10px] uppercase tracking-wide text-slate-500 dark:text-slate-400 capitalize"
                                      x-show="call.approval && call.approval !== 'pending'"
                                      x-text="call.approval"></span>
                              </div>
                              <div x-show="call.arguments && Object.keys(call.arguments || {}).length > 0"
                                   class="px-3 py-2 text-xs text-slate-700 dark:text-slate-300 bg-white dark:bg-slate-900">
                                <span class="font-medium">Arguments:</span>
                                <div class="mt-1 bg-slate-100 dark:bg-slate-950 border border-slate-200 dark:border-slate-800 rounded p-2 overflow-x-auto max-h-32">
                                  <pre class="text-slate-600 dark:text-slate-400 font-mono text-xs whitespace-pre-wrap break-words" x-text="JSON.stringify(call.arguments, null, 2)"></pre>
                                </div>
                              </div>
                              <div x-show="call.result != null"
                                   class="px-3 py-2 text-xs bg-white dark:bg-slate-900 border-t border-slate-200 dark:border-slate-700">
                                <span class="font-medium text-slate-700 dark:text-slate-300">Result:</span>
                                <div class="mt-1 bg-slate-100 dark:bg-slate-950 border border-slate-200 dark:border-slate-800 rounded p-2 overflow-x-auto max-h-64">
                                  <pre class="font-mono text-xs whitespace-pre-wrap break-words"
                                       :class="call.isError || call.approval === 'denied' ? 'text-red-600 dark:text-red-400' : 'text-slate-600 dark:text-slate-400'"
                                       x-text="call.result"></pre>
                                </div>
                              </div>
                            </div>
                          </template>
                        </div>
                      </div>
                    </template>

                    <!-- ====== RESPONSE (markdown-rendered assistant text). ====== -->
                    <div x-show="m.role === 'assistant'" class="prose-chat">
                      <template x-if="m.content"><div x-html="formatContent(m.content)"></div></template>
                      <span x-show="streaming && idx === messages.length - 1 && m.content"
                            class="inline-block w-2 h-4 align-text-bottom ml-0.5 bg-blue-500 dark:bg-blue-400 animate-blink"></span>
                    </div>
                    <div x-show="m.role !== 'assistant' && m.role !== 'tool'" class="whitespace-pre-wrap break-words" x-text="m.content"></div>

                    <!-- Bouncing dots while waiting for the first delta. -->
                    <div x-show="m.role === 'assistant' && streaming && idx === messages.length - 1 && !m.content && (!m.tool_calls || m.tool_calls.length === 0)"
                         class="flex items-center gap-2 py-2" role="status" aria-label="Loading response">
                      <span class="sr-only">Loading response…</span>
                      <span class="flex space-x-1">
                        <span class="w-2.5 h-2.5 bg-slate-400 dark:bg-slate-500 rounded-full webchat-bounce"></span>
                        <span class="w-2.5 h-2.5 bg-slate-400 dark:bg-slate-500 rounded-full webchat-bounce" style="animation-delay: 0.1s"></span>
                        <span class="w-2.5 h-2.5 bg-slate-400 dark:bg-slate-500 rounded-full webchat-bounce" style="animation-delay: 0.2s"></span>
                      </span>
                      <span class="text-xs text-slate-400 dark:text-slate-500">thinking…</span>
                    </div>

                    <!-- ====== APPROVAL PROMPT (bottom of the bubble, only
                         when there are pending tool calls). Pinned to the
                         end of the stream so the user always sees what
                         needs their attention, even if thinking or tool
                         call blocks above are expanded. ====== -->
                    <template x-if="m.role === 'assistant' && m.tool_calls && m.tool_calls.some(c => c.approval === 'pending')">
                      <div x-ref="approvalCard" class="mt-3 rounded-lg border border-amber-300 dark:border-amber-700 bg-amber-50 dark:bg-amber-900/30 p-4">
                        <template x-for="call in m.tool_calls.filter(c => c.approval === 'pending')" :key="call.id">
                          <div class="space-y-3">
                            <div class="flex items-center gap-2 text-sm font-semibold text-amber-900 dark:text-amber-100">
                              <svg class="w-4 h-4 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v4m0 4h.01M10.29 3.86 1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0Z" />
                              </svg>
                              Allow <code class="bg-amber-200 dark:bg-amber-800 text-amber-900 dark:text-amber-100 px-1.5 py-0.5 rounded font-mono" x-text="call.name"></code> to run?
                            </div>
                            <div x-show="call.arguments && Object.keys(call.arguments || {}).length > 0"
                                 class="bg-white/60 dark:bg-black/30 rounded p-2.5 max-h-40 overflow-y-auto">
                              <pre class="text-xs text-amber-800 dark:text-amber-200 font-mono whitespace-pre-wrap break-words" x-text="JSON.stringify(call.arguments, null, 2)"></pre>
                            </div>
                            <div class="flex items-center gap-3">
                              <button type="button" @click="approveToolCall(call, false)"
                                      class="px-4 py-2 text-xs font-medium rounded-md bg-blue-600 text-white hover:bg-blue-700 cursor-pointer">
                                Allow
                              </button>
                              <button type="button" @click="approveToolCall(call, true)"
                                      class="px-4 py-2 text-xs font-medium rounded-md bg-blue-100 dark:bg-blue-900/40 text-blue-700 dark:text-blue-300 hover:bg-blue-200 dark:hover:bg-blue-900/60 cursor-pointer">
                                Always Allow
                              </button>
                              <button type="button" @click="denyToolCall(call)"
                                      class="px-4 py-2 text-xs font-medium rounded-md bg-slate-200 text-slate-900 hover:bg-slate-300 dark:bg-slate-700 dark:text-white dark:hover:bg-slate-600 cursor-pointer">
                                Deny
                              </button>
                            </div>
                          </div>
                        </template>
                      </div>
                    </template>
                  </div>
                </div>
                </template>
              </template>
              <!-- Note: no separate "thinking" or "busy" element. The empty
                   assistant bubble itself carries the bouncing dots (above)
                   until the first delta arrives, then carries the streaming
                   text + typing cursor. One bubble, one place to look. -->

              <!-- Jump-to-bottom button: appears when the user has scrolled
                   up while a response is streaming, so they can snap back
                   to the latest output without having to wheel all the way
                   down. Clicking also clears userHasScrolled so auto-scroll
                   resumes. -->
              <div x-show="userHasScrolled" x-transition.opacity
                   class="sticky bottom-2 flex justify-center pointer-events-none">
                <button @click="userHasScrolled = false; scrollToBottom()"
                        class="pointer-events-auto px-3 py-1.5 rounded-full bg-white dark:bg-slate-800 shadow-lg border border-slate-200 dark:border-slate-700 text-xs font-medium text-slate-700 dark:text-slate-200 hover:bg-slate-50 dark:hover:bg-slate-700 cursor-pointer flex items-center gap-1.5">
                  <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 14l-7 7m0 0l-7-7m7 7V3" />
                  </svg>
                  Latest
                </button>
              </div>
            </div>

            <!-- Composer. shrink-0 stops the flex column from collapsing
                 this when the transcript overflows; the textarea's own
                 max-h-40 caps its growth. relative for the slash dropdown. -->
            <div class="shrink-0 pt-2 relative">
              <div x-show="commandHint" class="text-xs text-slate-500 dark:text-slate-400 mb-1" x-text="commandHint"></div>

              <!-- Slash command autocomplete dropdown -->
              <div x-show="slashOpen && slashMatches.length > 0" x-cloak
                   class="absolute bottom-full left-0 right-0 mb-1 bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-lg shadow-lg max-h-60 overflow-y-auto z-10">
                <template x-for="(cmd, i) in slashMatches" :key="cmd.id">
                  <button type="button"
                          @click="selectSlashCommand(cmd)"
                          @mouseenter="slashIndex = i"
                          class="w-full text-left px-3 py-2 text-sm flex items-center gap-3 transition-colors cursor-pointer"
                          :class="i === slashIndex ? 'bg-blue-50 dark:bg-blue-900/30 text-blue-700 dark:text-blue-300' : 'text-slate-700 dark:text-slate-300 hover:bg-slate-50 dark:hover:bg-slate-700/50'">
                    <span class="font-mono text-xs font-semibold">/<span x-text="cmd.name"></span></span>
                    <span class="text-xs text-slate-500 dark:text-slate-400 truncate flex-1" x-text="cmd.description"></span>
                    <span x-show="cmd.argument_hint" class="text-xs text-slate-400 dark:text-slate-500 font-mono shrink-0" x-text="cmd.argument_hint"></span>
                  </button>
                </template>
              </div>

              <div class="flex items-end gap-2">
                <textarea
                  x-ref="composer"
                  x-model="draft"
                  @keydown.enter="onEnter($event)"
                  @keydown.arrow-up="onArrowUp($event)"
                  @keydown.arrow-down="onArrowDown($event)"
                  @keydown.escape="slashOpen = false"
                  @blur="setTimeout(() => slashOpen = false, 150)"
                  rows="1"
                  placeholder="Type a message... (/ for commands, shift+enter for newline, ↑/↓ for history)"
                  class="flex-1 resize-none rounded-xl border border-slate-300 dark:border-slate-700 bg-white dark:bg-slate-900 px-4 py-2 text-sm text-slate-900 dark:text-white placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-blue-500 max-h-40 overflow-y-auto"
                ></textarea>
                <button x-show="!streaming" @click="send()" :disabled="streaming || !draft.trim()"
                        class="px-4 py-2 rounded-xl bg-blue-600 hover:bg-blue-700 disabled:bg-slate-300 dark:disabled:bg-slate-700 disabled:cursor-not-allowed text-white text-sm font-medium cursor-pointer">
                  Send
                </button>
                <button x-show="streaming" @click="cancelStream()"
                        class="px-4 py-2 rounded-xl bg-red-600 hover:bg-red-700 text-white text-sm font-medium cursor-pointer flex items-center gap-1.5">
                  <svg class="w-3.5 h-3.5" fill="currentColor" viewBox="0 0 24 24"><rect x="6" y="6" width="12" height="12" rx="1.5" /></svg>
                  Stop
                </button>
              </div>
            </div>
          </div>
        </section>
      </main>
    </div>

    <style>
      [x-cloak] { display: none !important; }
      .input-field {
        width: 100%;
        padding: 0.5rem 0.75rem;
        border-radius: 0.5rem;
        border: 1px solid rgb(203 213 225);
        background-color: white;
        color: rgb(15 23 42);
        font-size: 0.875rem;
      }
      .dark .input-field {
        background-color: rgb(15 23 42);
        border-color: rgb(51 65 85);
        color: white;
      }
    </style>
  </body>
</html>
